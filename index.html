<!doctype html>
<html lang="en">
  <head>
    <script>
      // Polyfill / normalize window.fetch descriptor before any extension or frame scripts run
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            window.fetch = window.fetch;
          } catch (e2) {}
        }

        // Prevent cross-origin extension script errors from bubbling to the window
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Suite - Creative Intelligence OS</title>

  </body>
