    <script>
      // Defensive window.fetch getter/setter initialization to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set) {
            var currentFetch = window.fetch ? window.fetch.bind(window) : (typeof fetch !== 'undefined' ? fetch : null);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if environment forbids redefinition
        }
      })();
    </script>
